# Lint and test only the live skill runtime.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          python -m compileall scripts/jianying_project.py scripts/jy_draft_crypto.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
