# Format/lint hooks for the live skill runtime only.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^scripts/(jianying_project|jy_draft_crypto)\.py$
      - id: ruff-format
        files: ^scripts/(jianying_project|jy_draft_crypto)\.py$

  - repo: local
    hooks:
      - id: unittest
        name: unittest skill runtime
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
